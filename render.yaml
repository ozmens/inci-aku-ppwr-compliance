# İnci Akü PPWR Compliance Suite — Render Blueprint
# Dashboard: New → Blueprint → bu repo (private)
services:
  - type: web
    name: inci-ppwr-compliance
    runtime: docker
    plan: standard
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: INCI_PPWR_WEB
        value: "1"
      - key: INCI_PPWR_VERSION
        value: "1.0.0"
      - key: INCI_PPWR_WORKSPACE_ROOT
        value: /data/workspace
      - key: INCI_PPWR_DELIVERY_ROOT
        value: /data/delivery
      - key: INCI_PPWR_CANDIDATES_ROOT
        value: /data/candidates
      - key: INCI_PPWR_ADMIN_USER
        value: admin
      - key: INCI_PPWR_ADMIN_PASSWORD
        value: "160616"
      - key: INCI_PPWR_JWT_SECRET
        generateValue: true
      - key: INCI_PPWR_AUTH
        value: "1"
    disk:
      name: ppwr-data
      mountPath: /data
      sizeGB: 50
